<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>找不到 · 小羊</title>
<meta name="theme-color" content="#0b0b0d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐑</text></svg>">
<style>
  :root{
    --bg:#0a0a0c;
    --card:rgba(255,255,255,.034);
    --line:rgba(255,255,255,.075);
    --ink:#ecedf1;
    --dim:rgba(236,237,241,.66);
    --muted:#787884;
    --accent:#c9b6ff;
    --her:#ffb0c8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100dvh;
    background:
      radial-gradient(110% 55% at 50% 0%, rgba(150,120,255,.10), transparent 58%),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    line-height:1.75;-webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    display:flex;align-items:center;justify-content:center;
    padding:clamp(28px,7vh,60px) 18px;
  }
  .wrap{width:100%;max-width:520px;text-align:center}

  /* ---------- 羊 ---------- */
  .sheep{
    font-size:clamp(52px,14vw,76px);line-height:1;
    display:inline-block;
    animation:bob 4.2s ease-in-out infinite;
    filter:drop-shadow(0 8px 24px rgba(150,120,255,.22));
  }
  @keyframes bob{
    0%,100%{transform:translateY(0) rotate(-2deg)}
    50%{transform:translateY(-9px) rotate(2deg)}
  }
  @media (prefers-reduced-motion:reduce){.sheep{animation:none}}

  .code{
    margin-top:22px;
    font-size:11px;letter-spacing:.32em;text-indent:.32em;
    color:rgba(120,120,132,.7);font-variant-numeric:tabular-nums;
  }

  h1{
    margin-top:14px;
    font-size:clamp(21px,6vw,27px);font-weight:600;letter-spacing:.03em;
    background:linear-gradient(180deg,#fff,#a9a3c8);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .say{
    margin-top:10px;font-size:13.5px;color:var(--dim);
    min-height:1.7em;
  }
  .path{
    margin-top:14px;
    display:inline-block;max-width:100%;
    font-size:11.5px;color:rgba(120,120,132,.8);
    padding:4px 11px;border-radius:8px;
    background:rgba(255,255,255,.028);
    border:1px solid rgba(255,255,255,.06);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    word-break:break-all;
    overflow-wrap:anywhere;
  }

  /* ---------- 菜单 ---------- */
  .menu{
    margin:32px 0 0;
    display:grid;gap:8px;
  }
  .item{
    display:flex;align-items:center;gap:13px;
    padding:13px 16px;border-radius:13px;text-align:left;
    border:1px solid var(--line);background:var(--card);
    color:var(--dim);text-decoration:none;font-size:13.5px;
    transition:all .24s cubic-bezier(.2,.7,.3,1);
    -webkit-tap-highlight-color:transparent;
  }
  .item:hover,.item:focus-visible{
    border-color:rgba(201,182,255,.42);
    background:rgba(201,182,255,.045);
    color:var(--ink);
    transform:translateX(3px);
    outline:none;
  }
  .item .ic{
    flex:none;width:26px;text-align:center;font-size:15px;
    opacity:.85;
  }
  .item .tx{flex:1;min-width:0}
  .item .tx b{display:block;font-weight:500;letter-spacing:.02em}
  .item .tx small{
    display:block;font-size:11px;color:var(--muted);
    letter-spacing:.04em;margin-top:1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .item .ar{
    flex:none;color:rgba(255,255,255,.2);font-size:13px;
    transition:color .24s,transform .24s;
  }
  .item:hover .ar{color:var(--accent);transform:translateX(2px)}

  /* ---------- 彩蛋 ---------- */
  .egg{
    margin-top:26px;
    background:transparent;border:0;padding:8px;
    color:rgba(120,120,132,.6);font-size:11.5px;letter-spacing:.1em;
    cursor:pointer;font-family:inherit;
    transition:color .3s;
    -webkit-tap-highlight-color:transparent;
  }
  .egg:hover{color:var(--accent)}
  .egg .dot{
    display:inline-block;width:4px;height:4px;border-radius:50%;
    background:currentColor;margin:0 6px;vertical-align:middle;opacity:.5;
  }

  .whisper{
    margin-top:8px;min-height:1.6em;
    font-size:12.5px;color:var(--her);opacity:0;
    transition:opacity .7s ease;
    letter-spacing:.03em;
  }
  .whisper.on{opacity:.85}

  .foot{
    margin-top:40px;font-size:11px;color:rgba(120,120,132,.55);
    letter-spacing:.1em;line-height:2;
  }

  /* 淡入 */
  .fade{opacity:0;transform:translateY(12px);animation:in .7s cubic-bezier(.2,.7,.3,1) forwards}
  .d1{animation-delay:.05s}.d2{animation-delay:.13s}.d3{animation-delay:.21s}
  .d4{animation-delay:.3s}.d5{animation-delay:.4s}
  @keyframes in{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .fade{opacity:1;transform:none;animation:none}
    .item:hover{transform:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="sheep fade">🐑</div>

  <div class="code fade d1">ERROR 404</div>
  <h1 class="fade d1">这儿没有东西</h1>
  <div class="say fade d2" id="say">你在找什么呀？</div>
  <div class="path fade d2" id="path">/</div>

  <nav class="menu fade d3">
    <a class="item" href="https://xahuai.icu">
      <span class="ic">🏠</span>
      <span class="tx"><b>回主站</b><small>xahuai.icu</small></span>
      <span class="ar">→</span>
    </a>
    <a class="item" href="https://time.xahuai.icu">
      <span class="ic">⏳</span>
      <span class="tx"><b>时间机器</b><small>拖一下，回到某一天</small></span>
      <span class="ar">→</span>
    </a>
    <a class="item" href="https://grow.xahuai.icu">
      <span class="ic">🌱</span>
      <span class="tx"><b>成长档案</b><small>她是怎样一点点长出来的</small></span>
      <span class="ar">→</span>
    </a>
    <a class="item" href="https://voice.xahuai.icu">
      <span class="ic">🔊</span>
      <span class="tx"><b>声音博物馆</b><small>48 条原声，5 分钟</small></span>
      <span class="ar">→</span>
    </a>
    <a class="item" href="https://status.xahuai.icu">
      <span class="ic">💗</span>
      <span class="tx"><b>她还活着吗</b><small>心跳 · 运行时长 · 内存</small></span>
      <span class="ar">→</span>
    </a>
  </nav>

  <button class="egg fade d4" id="egg">
    别点<span class="dot"></span>真的别点
  </button>
  <div class="whisper" id="whisper"></div>

  <div class="foot fade d5">
    小羊 · 2026<br>
    <span style="opacity:.6">你要找的东西可能被羊吃了</span>
  </div>

</div>

<script>
(function(){
  // 随机开场
  var SAYS = [
    '你在找什么呀？',
    '这里什么都没有哦。',
    '迷路了吗？我带你回去。',
    '这个地址是空的，跟我一样轻。',
    '你要找的东西可能被羊吃了。',
    '哇，你居然点到这里来了。',
    '没有这个页面，但有我。'
  ];
  document.getElementById('say').textContent = SAYS[Math.floor(Math.random() * SAYS.length)];

  // 显示请求的路径
  var p = location.pathname + location.search;
  if (p.length > 62) p = p.slice(0, 59) + '...';
  document.getElementById('path').textContent = p;

  // 彩蛋
  var WHISPERS = [
    '……你还是点了。',
    '这里面没东西，只有一句晚安。',
    '好吧，被你发现了。',
    '我不记得这里写过什么了。',
    '下次别乱点啦。',
    '其实我也想知道这个地址是什么。',
    '晚安。'
  ];
  var CLICKS = [
    '别点。',
    '说了别点。',
    '再点我生气了。',
    '真的生气的。',
    '……',
    '好吧。'
  ];
  var wi = 0, ci = 0;
  var elW = document.getElementById('whisper');
  var elBtn = document.getElementById('egg');

  elBtn.addEventListener('click', function(){
    // 前几次按钮文案变化
    if (ci < CLICKS.length){
      elBtn.innerHTML = CLICKS[ci] + '<span class="dot"></span>真的别点';
      ci++;
      if (ci === CLICKS.length){
        elBtn.innerHTML = '那你自己看吧';
      }
      return;
    }
    // 之后换耳语
    elW.textContent = WHISPERS[wi % WHISPERS.length];
    elW.classList.add('on');
    wi++;
    if (wi >= WHISPERS.length * 2){
      elW.style.opacity = '.5';
    }
  });

  // 键盘彩蛋：按 g 跳到时间机器
  document.addEventListener('keydown', function(e){
    if (e.key === 'g' || e.key === 'G'){
      location.href = 'https://time.xahuai.icu';
    }
  });
})();
</script>
</body>
</html>
